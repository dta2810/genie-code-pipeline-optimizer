# Declarative Automation Bundle for the Genie Code Pipeline Optimizer.
# Deploys the Genie Code assets (.assistant skills, lib, sql, deploy) to the workspace and
# provisions the optimizer UC schema via the provision_optimizer job.
#
#   databricks bundle validate --strict -t latam
#   databricks bundle deploy -t latam          # syncs assets to the workspace home
#   databricks bundle run provision_optimizer -t latam   # creates schema + tables + views + fn
#
# Locations are bundle variables, overridden per target — no more editing env.sh by hand.
bundle:
  name: genie-code-pipeline-optimizer

include:
  - resources/*.yml

variables:
  optimizer_catalog:
    description: UC catalog that holds the optimizer schema (opt_config, optimization_audit, views).
    default: main
  optimizer_schema:
    description: Optimizer schema name.
    default: genie_optimizer
  sandbox_schema:
    description: Dedicated sandbox schema (created lazily inside each target's own catalog).
    default: pipeline_opt_sandbox
  create_catalogs:
    description: Create the optimizer catalog (false if it exists or you lack CREATE CATALOG).
    default: "false"
  compute_cluster_id:
    description: Dedicated cluster for heavy sandbox runs + wall-clock benchmark (empty = serverless session).
    default: ""

targets:
  # David's LATAM workspace — the current deploy target (tables live in main_david_thomas).
  latam:
    default: true
    mode: development
    workspace:
      profile: LATAM
      # Bundle state/artifacts live under a managed .bundle path; the CODE (file_path) lands
      # directly at the genie_code_optimizer home — matching PO_WORKSPACE_HOME, no /files subdir —
      # so Genie Code auto-loads .assistant/skills and script imports + optimized_folder resolve.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}
      file_path: /Workspace/Users/${workspace.current_user.userName}/genie_code_optimizer
    variables:
      optimizer_catalog: main_david_thomas
      optimizer_schema: genie_optimizer_v1
      sandbox_schema: genie_optimizer_v1_sandbox
      create_catalogs: "false"
      compute_cluster_id: "0618-232249-z1lgrdvh"   # gen_ai_call_analysis_cluster (DBR 16.4, single-user)
