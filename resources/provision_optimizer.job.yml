# One-shot provisioning job: creates the optimizer schema + opt_config + optimization_audit +
# get_opt_config + governance views by running deploy/00_deploy.py (which calls provision.py).
# Idempotent (CREATE ... IF NOT EXISTS / OR REPLACE) — safe to re-run. Serverless (no cluster spec).
#   databricks bundle run provision_optimizer -t latam
resources:
  jobs:
    provision_optimizer:
      name: "[${bundle.target}] genie-code-optimizer · provision optimizer"
      tasks:
        - task_key: provision
          notebook_task:
            notebook_path: ../deploy/00_deploy.py
            base_parameters:
              optimizer_catalog: ${var.optimizer_catalog}
              optimizer_schema: ${var.optimizer_schema}
              sandbox_schema: ${var.sandbox_schema}
              compute_cluster_id: ${var.compute_cluster_id}
              create_catalogs: ${var.create_catalogs}
